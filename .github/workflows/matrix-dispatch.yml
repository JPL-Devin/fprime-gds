name: matrix-dispatch (fork only)

on:
  workflow_dispatch:
  push:
    branches: [ ci/matrix-devel ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        shell: bash
        run: |
          pytest -q test --deselect test/fprime_gds/common/yamcs_transport_test.py -p no:cacheprovider
      - name: Plugin registry lists udp-fast, no-op and the CCSDS chains
        shell: bash
        run: |
          fprime-comm-bridge --help | tee bridge-help.txt
          grep -E "udp-fast|no-op|raw-space-data-link|space-packet-space-data-link|tm-frame-aggregator" bridge-help.txt
