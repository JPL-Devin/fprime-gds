name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JPL-Devin/fprime
          path: target/fprime
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: F Prime tools and the Python GDS
        run: |
          python -m venv target/fprime/fprime-venv
          target/fprime/fprime-venv/bin/pip install -r target/fprime/requirements.txt
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Check
        run: FPRIME=$PWD/target/fprime scripts/check.sh
