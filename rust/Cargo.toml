[workspace]
resolver = "2"
members = [
    "crates/fprime-types",
    "crates/fprime-dict",
    "crates/fprime-frame",
    "crates/fprime-ccsds",
    "crates/fprime-pipeline",
    "crates/fprime-comm",
    "crates/fprime-gds-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JPL-Devin/fprime-gds"
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
crc32fast = "1.4"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
clap = { version = "=4.5.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = "14.0"
shlex = "1.3"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

fprime-types = { path = "crates/fprime-types", version = "0.1.0" }
fprime-dict = { path = "crates/fprime-dict", version = "0.1.0" }
fprime-frame = { path = "crates/fprime-frame", version = "0.1.0" }
fprime-ccsds = { path = "crates/fprime-ccsds", version = "0.1.0" }
fprime-pipeline = { path = "crates/fprime-pipeline", version = "0.1.0" }
fprime-comm = { path = "crates/fprime-comm", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
